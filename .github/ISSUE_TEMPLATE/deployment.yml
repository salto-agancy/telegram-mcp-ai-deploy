name: Deployment problem
description: Get help with VPS, Docker, Cloudflare, authentication or health checks
title: "[Deploy]: "
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.34.0
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failed stage
      options:
        - preflight
        - bootstrap
        - secrets initialization
        - Telegram login
        - Cloudflare provisioning
        - deploy
        - healthcheck
        - update or rollback
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Sanitized platform information
      placeholder: Ubuntu 24.04, x86_64, Docker 27
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed tokens, domains, IPs, usernames, phone numbers, sessions, ACLs and SSH details.
          required: true
        - label: This is not a vulnerability; security reports go through GitHub Security Advisories.
          required: true
