name: Feature request
description: Propose a focused capability or improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user problem without private Telegram examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Telegram tool
        - Authentication or ACL
        - Deployment or update
        - Documentation or AI workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Does this add write access, new credentials, or change a tool schema?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This proposal contains no real credentials, Telegram data or production configuration.
          required: true
