name: MCP client compatibility
description: Report a Claude, Claude Code, ChatGPT, Codex or other client problem
title: "[Client]: "
body:
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude
        - Claude Code
        - ChatGPT
        - Codex
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Client and server versions
      placeholder: Client version; server v0.34.0
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Connection method
      options:
        - OAuth endpoint
        - Bearer Streamable HTTP endpoint
        - Local stdio
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Reproduction and sanitized error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed endpoint hostnames, auth headers, tokens and Telegram data.
          required: true
