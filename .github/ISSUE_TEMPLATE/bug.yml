name: Bug report
description: Report a reproducible problem in the MCP server
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Never include credentials, Telegram content, real hosts, IPs, phone numbers, chat names, or session files.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA
      placeholder: v0.34.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Docker Compose with Cloudflare Tunnel
        - Local stdio
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all private operational data before pasting.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, sessions, Telegram data, hostnames, IPs, phone numbers and local paths.
          required: true
        - label: This report is not a security vulnerability.
          required: true
