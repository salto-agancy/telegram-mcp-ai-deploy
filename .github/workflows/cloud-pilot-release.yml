name: Cloud pilot release

on:
  push:
    branches: [feature/cloud-mcp-pilot]

permissions:
  contents: read

concurrency:
  group: telegram-mcp-cloud-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv sync --frozen
      - run: make check
      - run: bash -n scripts/cloud_auto_update.sh
      - name: Validate pilot Compose and image
        env:
          CLOUD_IMAGE_TAG: ci
          CLOUD_PUBLIC_BASE_URL: https://pilot.example
          CLOUD_REDIRECT_URIS: https://client.example/callback
          CLOUD_BIND_PORT: 18001
          CLOUD_TRUSTED_PROXY_IP: 127.0.0.1
          CLOUD_SECRET_DIR: /tmp/pilot-ci
          TELEGRAM_API_ID: 1
        run: |
          docker compose -f docker-compose.cloud.yml config --quiet
          docker compose -f docker-compose.cloud.yml build cloud-oauth
      - name: Scan full history with Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git --no-banner --redact /repo
  promote:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Promote the verified commit
        run: git push origin HEAD:refs/heads/release-cloud
