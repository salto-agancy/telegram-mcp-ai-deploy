<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram MCP</title>
<style>
:root { color-scheme:light dark; --bg:var(--tg-theme-secondary-bg-color, #f2f2f7); --surface:var(--tg-theme-bg-color, #fff); --text:var(--tg-theme-text-color,#19191d); --blue:var(--tg-theme-button-color,#145fce); }
@media (prefers-color-scheme:dark) { :root { --bg:var(--tg-theme-secondary-bg-color,#101014); --surface:var(--tg-theme-bg-color,#202025); --text:var(--tg-theme-text-color,#f4f4f7); } }
* { box-sizing:border-box } body { margin:0; padding:24px 16px max(24px,env(safe-area-inset-bottom)); background:var(--bg); color:var(--text); font:17px/1.45 system-ui }
article { max-width:440px; margin:4vh auto; background:var(--surface); border-radius:20px; padding:22px } h1 {font-size:30px;line-height:1.12;letter-spacing:-.035em;margin:0 0 16px}
p {margin:12px 0;overflow-wrap:anywhere} code {overflow-wrap:anywhere} input,button {font:inherit} button,input[type=search] {width:100%;min-height:46px;border-radius:12px;border:0;padding:10px 12px;margin:5px 0}
button {background:var(--bg);color:var(--text);font-weight:600} button.primary {background:var(--blue);color:var(--tg-theme-button-text-color,#fff)}
button:active {opacity:.75} :focus-visible {outline:2px solid var(--blue);outline-offset:2px} label {display:block;padding:10px 0} label[hidden],[hidden] {display:none}
.challenge {font:600 36px ui-monospace,monospace;letter-spacing:.16em}
#messages:empty {display:none} #messages[data-busy=true]::before {content:"";display:inline-block;width:.85em;height:.85em;margin-right:.55em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin {to{transform:rotate(1turn)}} @media(prefers-reduced-motion:reduce){#messages[data-busy=true]::before{animation:none}}
</style>
<article><h1 id="title">Telegram MCP</h1><p id="messages" role="status" aria-live="polite" data-busy="true">Открываем приложение…</p><main id="panel"></main></article>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const app = window.Telegram?.WebApp;
const panel = document.querySelector('#panel');
const messages = document.querySelector('#messages');
let proof, nonce;
function show(tag, text, attrs={}, parent=panel) {
  const el = document.createElement(tag);
  el.textContent = text;
  Object.assign(el, attrs);
  parent.append(el);
  return el;
}
function button(text, onclick) { return show('button', text, {onclick}); }
function storage(method, ...args) {
  return new Promise((resolve, reject) => app.CloudStorage[method](...args, (error, value) => error ? reject(error) : resolve(value)));
}
function closed() { button('Закрыть', () => app.close()).className = 'primary'; }
function heading(text) { document.querySelector('#title').textContent = text; }
function receipt(allowed, linked) {
  panel.replaceChildren();
  heading(allowed ? 'Подтверждение принято' : 'Запрос отклонён');
  if (allowed && !linked) show('p', 'Доступа к чатам пока нет.');
  show('p', 'Ответ сохранён. Вернитесь в окно, где начали подключение.');
  closed();
}
async function api(action, value) {
  if (panel.inert) return;
  panel.inert = true;
  messages.dataset.busy = 'true';
  messages.textContent = action === 'decision' ? 'Отправляем ваш ответ…' : 'Загружаем…';
  try {
    const response = await fetch('/app/api/' + action, {method:'POST', headers:{'Content-Type':'application/json','X-Cloud-Nonce':nonce}, body:JSON.stringify({proof,value})});
    const data = await response.json();
    if (data.error || !response.ok) {
      messages.textContent = data.error || 'Запрос не выполнен. Откройте приложение заново.';
      return;
    }
    messages.textContent = '';
    if (typeof data.decision_recorded === 'boolean') return receipt(data.decision_recorded, data.step === 'connected');
    render(data);
  } catch {
    messages.textContent = 'Ответ сервера не получен. Откройте исходное окно и проверьте состояние подключения.';
  } finally {
    messages.dataset.busy = 'false';
    panel.inert = false;
  }
}
function render(data) {
  panel.replaceChildren();
  if (data.step === 'chats') {
    heading('Выберите чаты');
    const filter = show('input', '', {type:'search', placeholder:'Поиск чатов', ariaLabel:'Поиск чатов'});
    const list = show('div', '');
    const inputs = data.choices.map(([id,title]) => {
      const row = show('label', '', {}, list);
      const box = show('input', '', {type:'checkbox', value:id, checked:data.selected?.includes(id) ?? false}, row);
      row.append(title);
      return [row, box, title.toLocaleLowerCase()];
    });
    filter.oninput = () => { for (const [row,,title] of inputs) row.hidden = !title.includes(filter.value.toLocaleLowerCase()); };
    show('p','Сообщения проходят через сервер владельца и выбранный вами ИИ-сервис. Переписки не сохраняются. Подключение на ваш риск. Отключить можно в любой момент');
    button('Разрешить чтение выбранных чатов', () => api('chats', inputs.filter(([,box])=>box.checked).map(([,box])=>box.value)));
  } else if (data.step === 'connected' || data.step === 'login_closed') {
    const linked = data.step === 'connected';
    if (data.oauth) {
      heading(linked ? 'Разрешить чтение?' : 'Подключить коннектор?');
      show('p', data.oauth.domain + (linked ? ' запрашивает доступ к выбранным вами чатам.' :
        ' сможет читать только те чаты, которые вы позже подключите и разрешите. Сейчас список пуст.'));
      show('p', 'Сверьте три цифры с исходным окном.');
      show('p', data.oauth.code, {className:'challenge'});
      button(linked ? 'Разрешить' : 'Подключить', () => api('decision', true)).className = 'primary';
      button('Отклонить', () => api('decision', false));
      return;
    }
    if (data.request_expired) {
      heading('Запрос завершён');
      show('p', 'Проверьте исходное окно. Если подключение не завершилось, начните его там заново.');
      closed();
      return;
    }
    heading(linked ? 'Telegram подключён' : 'Доступ к пилоту открыт');
    if (!linked) show('p', 'Коннектор можно добавить в Perplexity уже сейчас. Чаты пока недоступны.');
    show('code', data.mcp_url);
    button('Скопировать', async () => {
      try { await navigator.clipboard.writeText(data.mcp_url); messages.textContent = 'URL скопирован.'; }
      catch { messages.textContent = 'Выделите адрес и скопируйте вручную.'; }
    });
    if (linked) button('Изменить чаты', () => api('edit'));
    for (const connection of data.connections ?? []) {
      const row = show('p', connection.name + ' ');
      show('button','Отключить',{onclick:()=>api('detach',connection.id)},row);
    }
    if (linked) button('Создать API-ключ', () => api('api_key'));
    if (data.key_sent) show('p', 'Ключ отправлен в личный чат с ботом.');
    closed();
    button('Удалить всё', () => { if (confirm('Отключить Telegram и освободить место?')) api('delete'); });
  } else if (data.step === 'deleted') {
    storage('removeItem', 'cloud-unlock-v1').then(() => { proof=undefined; }).catch(() => {});
    show('p', 'Сессия удалена. Для подключения нужно новое приглашение.');
  }
}
(async () => {
  if (!app?.initData) throw Error();
  app.ready();
  if (app.isVersionAtLeast?.('7.7')) app.enableVerticalSwipes?.();
  const signature = new URLSearchParams(app.initData).get('hash');
  const saved = JSON.parse(sessionStorage.getItem('cloud-launch') || 'null');
  if (saved && saved.signature === signature) {
    nonce = saved.nonce;
  } else {
    const response = await fetch('/app/api/session', {method:'POST', headers:{'X-Telegram-Init-Data':app.initData}});
    if (!response.ok) throw Error();
    nonce = (await response.json()).nonce;
    sessionStorage.setItem('cloud-launch', JSON.stringify({signature, nonce}));
  }
  proof = await storage('getItem', 'cloud-unlock-v1');
  if (!proof) {
    proof = Array.from(crypto.getRandomValues(new Uint8Array(32)), n=>n.toString(16).padStart(2,'0')).join('');
    await storage('setItem', 'cloud-unlock-v1', proof);
  }
  await api('status');
})().catch(() => {
  messages.dataset.busy = 'false';
  messages.textContent = 'Откройте приглашение от владельца в Telegram. Если вы пришли из ИИ, затем вернитесь в исходное окно подключения.';
  if (app?.close) closed();
});
</script>
</html>
